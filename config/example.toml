# Example vkgsplat config (INI/TOML accepted by CLI11).
# Usage: vkgsplat --config config/example.toml
# CLI arguments override values from this file.

ply_path = "resources/x/PLY/point_cloud/iteration_100/point_cloud_1.ply"
validation = true
imgui = true
gpu-timers = true
# frame-rate = "display"   # or "adaptive", or a positive integer like 60

# Camera extrinsics: orientation from look-at (position → target) with world-up.
camera-position = [0.0, 1.5, 10.0]
camera-target = [0.0, 1.0, 0.0]
camera-up = [0.0, -1.0, 0.0]

# Camera intrinsics / controls.
camera-fov = 45.0
camera-near = 0.1
camera-far = 100.0
# Preferred aspect; windowed mode still uses the swapchain aspect each frame.
camera-aspect = 1.0
camera-speed = 12.5
camera-sensitivity = 0.1

# LFD quilt: columns rows. {1,1} is standard mono rendering.
lfd-grid = [3, 3]
# View placement in the quilt atlas (row-major cell order):
#   normal    -> 0,1 / 2,3
#   flip-rows -> 2,3 / 0,1  (for 2x2; generalizes to 3x3 as 6,7,8 / 3,4,5 / 0,1,2)
lfd-view-layout = "normal"
# Optional explicit permutation (overrides lfd-view-layout), e.g. for 3x3:
# lfd-view-order = [6, 7, 8, 3, 4, 5, 0, 1, 2]
# Horizontal view cone (degrees) across quilt columns when grid > 1x1.
view-cone = 4.0

# Keybinds (GLFW key names: A-Z, 0-9, F1-F12, SPACE, ESCAPE, LEFT/RIGHT/UP/DOWN,
# LEFT_CONTROL / LCTRL, LEFT_SHIFT, ...). Mouse look + scroll zoom are always on.
key-forward = "W"
key-backward = "S"
key-left = "A"
key-right = "D"
key-up = "SPACE"
key-down = "LEFT_CONTROL"
key-roll-left = "Q"
key-roll-right = "E"
key-close = "ESCAPE"
key-screenshot = "F2"
key-emulate = "M"
key-cell-left = "LEFT"
key-cell-right = "RIGHT"
key-cell-up = "UP"
key-cell-down = "DOWN"
